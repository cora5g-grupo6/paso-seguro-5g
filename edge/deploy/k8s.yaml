# Paso Seguro 5G en Kubernetes (por si el MXIE expone Kubernetes en vez de Docker).
#   1) Cargar la imagen en el nodo:  docker save paso-seguro-borde:0.1 | gzip > borde.tar.gz
#      y en el nodo:                ctr -n k8s.io images import borde.tar.gz   (o subirla a un registro)
#   2) Ajustar CAMARA_FUENTES y URL_PUBLICA abajo.
#   3) kubectl apply -f deploy/k8s.yaml
#   Tablero: http://IP-DEL-NODO:30080 · MQTT para el ESP32: IP-DEL-NODO:31883
apiVersion: v1
kind: ConfigMap
metadata:
  name: paso-seguro-config
data:
  CAMARA_FUENTES: "rtsp://IP-CAMARA:554/RUTA"
  URL_PUBLICA: "http://IP-DEL-NODO:30080"
  MQTT_HOST: "127.0.0.1"
  MODO_DEMO: "true"
  PERSONAS_METODO: "movimiento"
  BAJADA_S: "30"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paso-seguro-mosquitto
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    allow_anonymous true
    persistence false
    log_dest stdout
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paso-seguro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paso-seguro
  template:
    metadata:
      labels:
        app: paso-seguro
    spec:
      containers:
        - name: borde
          image: paso-seguro-borde:0.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: paso-seguro-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ping
              port: 8000
            periodSeconds: 5
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits: { cpu: "4", memory: 2Gi }
          volumeMounts:
            - name: datos
              mountPath: /app/datos
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports:
            - containerPort: 1883
          volumeMounts:
            - name: mosquitto-conf
              mountPath: /mosquitto/config
      volumes:
        - name: datos
          emptyDir: {}
        - name: mosquitto-conf
          configMap:
            name: paso-seguro-mosquitto
---
apiVersion: v1
kind: Service
metadata:
  name: paso-seguro
spec:
  type: NodePort
  selector:
    app: paso-seguro
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
    - name: mqtt
      port: 1883
      targetPort: 1883
      nodePort: 31883
